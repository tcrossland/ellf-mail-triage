[project]
name = "ellf-mail-triage"
version = "0.0.0"
description = "An Ellf template that sorts archived mail into kinds with a small local text classifier"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# Not a package: scripts/ holds plain files run with uv run.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# recipes/ holds code adapted from explosion/ellf-templates, kept in its own
# style so it diffs cleanly against the original.
extend-exclude = ["recipes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    # pytest: MIT. Transitive: iniconfig (MIT), packaging (Apache-2.0 OR
    # BSD-2-Clause), pluggy (MIT), pygments (BSD-2-Clause).
    "pytest>=9.2.0",
    # ruff: MIT. Formatter and linter.
    "ruff>=0.17.6",
]
